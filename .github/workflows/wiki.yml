name: wiki

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: wiki-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Validate and build native wiki
        env:
          WIKI_MIN_PAGES: ${{ vars.WIKI_MIN_PAGES }}
        run: ./gradlew -p wiki build -PwikiMinimumPages="${WIKI_MIN_PAGES:-250}" --no-daemon

      - name: Upload wiki preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-wiki-${{ github.sha }}
          path: build/wiki
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish native GitHub wiki
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-native-wiki-publish
      cancel-in-progress: false
    environment:
      name: github-wiki
      url: ${{ github.server_url }}/${{ github.repository }}/wiki
    permissions:
      contents: write
    steps:
      - name: Check out wiki build tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Download validated wiki
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-wiki-${{ github.sha }}
          path: generated-wiki

      - name: Verify publication artifact
        env:
          WIKI_MIN_PAGES: ${{ vars.WIKI_MIN_PAGES }}
        run: >-
          ./gradlew -p wiki verifyWikiManifest
          -PwikiOutput=generated-wiki
          -PwikiMinimumPages="${WIKI_MIN_PAGES:-250}"
          --no-daemon

      - name: Publish changed pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          WIKI_REMOTE: ${{ github.server_url }}/${{ github.repository }}.wiki.git
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          latest="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote "$MAIN_REMOTE" refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded source commit $GITHUB_SHA; main is $latest."
            exit 0
          fi

          for attempt in 1 2 3; do
            rm -rf published-wiki
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              clone --depth=1 "$WIKI_REMOTE" published-wiki

            branch="$(git -C published-wiki symbolic-ref --short HEAD)"
            rsync -a --delete --exclude='.git/' generated-wiki/ published-wiki/
            git -C published-wiki add --all
            if git -C published-wiki diff --cached --quiet; then
              echo "Wiki is already current."
              exit 0
            fi

            git -C published-wiki commit \
              -m "docs: publish wiki from ${GITHUB_SHA::12}" \
              -m "Source-Commit: $GITHUB_SHA" \
              -m "Workflow-Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

            latest="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote "$MAIN_REMOTE" refs/heads/main | awk 'NR == 1 {print $1}')"
            if [[ "$latest" != "$GITHUB_SHA" ]]; then
              echo "Skipping superseded source commit $GITHUB_SHA; main is $latest."
              exit 0
            fi

            if git -C published-wiki \
              -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              push origin "HEAD:refs/heads/$branch"; then
              exit 0
            fi
            echo "Wiki changed during publish; retrying ($attempt/3)."
          done

          echo "::error::Wiki push failed after three attempts."
          exit 1

  external-links:
    name: Report external wiki links
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out quality tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Download validated wiki
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-wiki-${{ github.sha }}
          path: generated-wiki

      - name: Audit external links
        run: >-
          ./gradlew -p wiki checkWikiLinks
          -PwikiOutput=generated-wiki
          --no-daemon

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: test ! -f build/wiki-external-links.md || cat build/wiki-external-links.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload external-link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-external-links-${{ github.sha }}
          path: build/wiki-external-links.*
          if-no-files-found: error
          retention-days: 30
