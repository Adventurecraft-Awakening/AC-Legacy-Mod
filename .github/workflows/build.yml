# Automatically build the project for every push and submitted pull request.

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        java: [27] # Use these Java versions
        os: [ubuntu-latest]
        artifacts: [true]
        
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # TODO: cache build artifacts manually because we can't have good things
          #       i wish i was making this up: https://blog.gradle.org/choice-clarity-future-caching-gradle-actions
          cache-provider: basic

      - name: build
        run: ./gradlew build --no-daemon

      - name: capture build artifacts
        if: ${{ matrix.artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: build/libs/
