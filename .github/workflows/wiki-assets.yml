name: wiki registry assets

on:
  pull_request:
    paths:
      - ".github/workflows/wiki-assets.yml"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "src/shaderCompiler/java/**"
      - "wiki/assets/registry/**"
      - "wiki/src/**"
      - "wiki/build.gradle"
      - "wiki/settings.gradle"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wiki-assets.yml"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "src/shaderCompiler/java/**"
      - "wiki/assets/registry/**"
      - "wiki/src/**"
      - "wiki/build.gradle"
      - "wiki/settings.gradle"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render and verify registry assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: wiki-assets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      # Use Mesa lavapipe through Vulkan. Mesa updates can change pixels, so
      # validation compares registry identity and each tree's own hashes.
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 27
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "27"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Install software Vulkan and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            vulkan-validationlayers \
            xauth \
            xvfb
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp*.json' -print -quit)"
          test -n "$lavapipe_icd"
          export VK_ICD_FILENAMES="$lavapipe_icd"
          export JAVA_TOOL_OPTIONS="-Dac.vulkan.validation=true"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/vulkan-runtime"
          mkdir -p build "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          xvfb-run -a -s "-screen 0 1280x1024x24" vulkaninfo --summary | tee build/vulkaninfo.txt
          # Lavapipe's Vulkan device name can contain llvmpipe on Mesa.
          grep -Eqi 'deviceName.*(lavapipe|llvmpipe)' build/vulkaninfo.txt
          grep -q 'VK_LAYER_KHRONOS_validation' build/vulkaninfo.txt

      - name: Render registry assets with lavapipe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/wiki-assets-lavapipe run/wiki-asset-exporter
          mkdir -p build/wiki-assets-lavapipe
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./gradlew runWikiAssetExporter \
            -PwikiAssetExportDir=build/wiki-assets-lavapipe \
            --no-daemon \
            --stacktrace

      - name: Verify committed and regenerated assets
        shell: bash
        run: ./gradlew -p wiki verifyWikiAssets checkWikiSources -PwikiRenderedAssets=build/wiki-assets-lavapipe --no-daemon

      - name: Upload lavapipe render
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-registry-assets-lavapipe-${{ github.sha }}
          path: |
            build/wiki-assets-lavapipe
            build/vulkaninfo.txt
            build/vulkan-validation.log
          if-no-files-found: error
          retention-days: 14
