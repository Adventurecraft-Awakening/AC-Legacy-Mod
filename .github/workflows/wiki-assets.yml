name: wiki registry assets

on:
  pull_request:
    paths:
      - ".github/workflows/wiki-assets.yml"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "wiki/assets/registry/**"
      - "wiki/src/**"
      - "wiki/build.gradle"
      - "wiki/settings.gradle"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wiki-assets.yml"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "wiki/assets/registry/**"
      - "wiki/src/**"
      - "wiki/build.gradle"
      - "wiki/settings.gradle"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render and verify registry assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: wiki-assets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      # Force the same software OpenGL path on every runner. Pixel output can
      # still change between Mesa releases, so validation compares registry
      # identity and checks each tree's own hashes rather than cross-GPU bytes.
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      __GLX_VENDOR_LIBRARY_NAME: mesa
      ALSOFT_DRIVERS: "null"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Install software OpenGL and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils \
            xauth \
            xvfb
          mkdir -p build
          xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B | tee build/glxinfo.txt
          grep -qi llvmpipe build/glxinfo.txt

      - name: Render registry assets with llvmpipe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/wiki-assets-llvmpipe run/wiki-asset-exporter
          mkdir -p build/wiki-assets-llvmpipe
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./gradlew runWikiAssetExporter \
            -PwikiAssetExportDir=build/wiki-assets-llvmpipe \
            --no-daemon \
            --stacktrace

      - name: Verify committed and regenerated assets
        shell: bash
        run: ./gradlew -p wiki verifyWikiAssets checkWikiSources -PwikiRenderedAssets=build/wiki-assets-llvmpipe --no-daemon

      - name: Upload llvmpipe render
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-registry-assets-llvmpipe-${{ github.sha }}
          path: build/wiki-assets-llvmpipe
          if-no-files-found: error
          retention-days: 14
